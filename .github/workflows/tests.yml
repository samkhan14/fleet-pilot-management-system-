name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create databases
        run: |
          php -r '
            $pdo = new PDO("mysql:host=127.0.0.1;port=3306", "root", "root");
            $pdo->exec("CREATE DATABASE IF NOT EXISTS fleetpilot CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
            $pdo->exec("CREATE DATABASE IF NOT EXISTS fleetpilot_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");
            $pdo->exec("CREATE USER IF NOT EXISTS \"fleetpilot\"@\"%\" IDENTIFIED BY \"fleetpilot\"");
            $pdo->exec("GRANT ALL ON fleetpilot.* TO \"fleetpilot\"@\"%\"");
            $pdo->exec("GRANT ALL ON fleetpilot_test.* TO \"fleetpilot\"@\"%\"");
            $pdo->exec("FLUSH PRIVILEGES");
          '

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
